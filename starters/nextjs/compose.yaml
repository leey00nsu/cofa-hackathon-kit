services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cofa}:${POSTGRES_PASSWORD:-cofa_local_password}@db:5432/${POSTGRES_DB:-cofa_app}"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cofa}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cofa_local_password}"
      POSTGRES_DB: "${POSTGRES_DB:-cofa_app}"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      # PostgreSQL 18: PGDATA=/var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
      - ./pg-init:/docker-entrypoint-initdb.d:ro
volumes:
  postgres_data:
